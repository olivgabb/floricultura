<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floricultura</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/home.css' %}">
</head>

<body>
    <header>
        <div class="header-content">
            <img src="{% static 'images/logo.png' %}" alt="Logo da Floricultura">
            <h1>Floricultura</h1>
        </div>
    </header>
    <table border='1'>
        <tr>
            <th>Nome</th>
            <th>Preço</th>
            <th>Categoria</th>
        </tr>
        {% for x in data %}
        <tr>
            <td><a href={{x.id}}>{{ x.nome }}</a></td>
            <td>{{ x.preco }}</td>
            <td>{{ x.categoria }}</td>
        </tr>
        {% endfor %}
    </table>
</body>

</html>
